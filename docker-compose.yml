services:
  nginx:
    image: nginx:1.27-alpine
    container_name: blogcms-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend:/var/www/html
      - media_storage:/var/www/html/storage/app/public
    depends_on:
      php:
        condition: service_started
      frontend:
        condition: service_started
    networks:
      - blogcms
    restart: unless-stopped

  php:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blogcms-php
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: blog
      DB_USERNAME: blog_user
      DB_PASSWORD: blog_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
      SANCTUM_STATEFUL_DOMAINS: localhost,localhost:5173,127.0.0.1,127.0.0.1:5173
      SESSION_DOMAIN: "null"
    volumes:
      - ./backend:/var/www/html
      - media_storage:/var/www/html/storage/app/public
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - blogcms
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blogcms-queue
    command: php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: blog
      DB_USERNAME: blog_user
      DB_PASSWORD: blog_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
    volumes:
      - ./backend:/var/www/html
      - media_storage:/var/www/html/storage/app/public
    depends_on:
      php:
        condition: service_started
    networks:
      - blogcms
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: blogcms-scheduler
    command: php artisan schedule:work
    env_file:
      - ./backend/.env
    environment:
      APP_URL: http://localhost
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: blog
      DB_USERNAME: blog_user
      DB_PASSWORD: blog_password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
    volumes:
      - ./backend:/var/www/html
      - media_storage:/var/www/html/storage/app/public
    depends_on:
      php:
        condition: service_started
    networks:
      - blogcms
    restart: unless-stopped

  mysql:
    image: mysql:8.0
    container_name: blogcms-mysql
    environment:
      MYSQL_DATABASE: blog
      MYSQL_USER: blog_user
      MYSQL_PASSWORD: blog_password
      MYSQL_ROOT_PASSWORD: root_password
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=caching_sha2_password
    volumes:
      - mysql_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-ublog_user", "-pblog_password"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - blogcms
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blogcms-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - blogcms
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: blogcms-phpmyadmin
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: blog_user
      PMA_PASSWORD: blog_password
      MYSQL_ROOT_PASSWORD: root_password
      UPLOAD_LIMIT: 64M
    ports:
      - "8081:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - blogcms
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: blogcms-frontend
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    networks:
      - blogcms
    restart: unless-stopped

volumes:
  mysql_data:
  redis_data:
  media_storage:
  frontend_node_modules:

networks:
  blogcms:
    driver: bridge
