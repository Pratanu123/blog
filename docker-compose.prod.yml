# Production overrides for the VPS deploy (inkandvoltage.com).
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# SSL stages:
#   1) HTTP only (default): mounts production-http.conf — validate DNS/HTTP first
#   2) After certs: set NGINX_CONF=production.conf and expose 443 (documented in docs/PRODUCTION_DEPLOYMENT.md)
#
# Keeps MySQL, Redis, and phpMyAdmin off the public Internet.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes: !override
      - ./docker/nginx/${NGINX_CONF:-production-http.conf}:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/app-locations.conf:/etc/nginx/snippets/app-locations.conf:ro
      - ./backend:/var/www/html
      - media_storage:/var/www/html/storage/app/public
      - ./docker/certbot/www:/var/www/certbot:ro
      - ./docker/certbot/conf:/etc/letsencrypt:ro

  php:
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://inkandvoltage.com}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog_user}
      DB_PASSWORD: ${DB_PASSWORD:-blog_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-inkandvoltage.com,www.inkandvoltage.com}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-null}
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://inkandvoltage.com,https://www.inkandvoltage.com}

  queue:
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://inkandvoltage.com}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog_user}
      DB_PASSWORD: ${DB_PASSWORD:-blog_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}

  scheduler:
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_DEBUG: ${APP_DEBUG:-false}
      APP_URL: ${APP_URL:-https://inkandvoltage.com}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-blog}
      DB_USERNAME: ${DB_USERNAME:-blog_user}
      DB_PASSWORD: ${DB_PASSWORD:-blog_password}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_CLIENT: phpredis
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: cookie
      FILESYSTEM_DISK: public
      SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}

  mysql:
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-blog}
      MYSQL_USER: ${DB_USERNAME:-blog_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-blog_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
    ports: !reset []
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    ports: !reset []

  phpmyadmin:
    profiles: ["tools"]
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: ${DB_USERNAME:-blog_user}
      PMA_PASSWORD: ${DB_PASSWORD:-blog_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password}
      UPLOAD_LIMIT: 64M
    ports:
      - "127.0.0.1:8081:80"

  frontend:
    environment:
      VITE_API_URL: /api
    # Production: typecheck + Vite build, then preview (proxied by Docker Nginx).
    # allowedHosts in vite.config.ts must include inkandvoltage.com.
    command: sh -c "npm install && npm run build && npx vite preview --host 0.0.0.0 --port 5173"
    ports: !reset []
