# Production HTTPS config for inkandvoltage.com.
# Requires certificates under /etc/letsencrypt (certbot volume).
# Obtain certs first with scripts/obtain-ssl.sh while using production-http.conf.

# ACME + HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name inkandvoltage.com www.inkandvoltage.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://inkandvoltage.com$request_uri;
    }
}

# www → apex (HTTPS)
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.inkandvoltage.com;

    ssl_certificate     /etc/letsencrypt/live/inkandvoltage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkandvoltage.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://inkandvoltage.com$request_uri;
}

# Canonical site
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name inkandvoltage.com;

    ssl_certificate     /etc/letsencrypt/live/inkandvoltage.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inkandvoltage.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/app-locations.conf;
}
