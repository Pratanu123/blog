# Reverse-proxy for the Next.js portfolio container (jb-portfolio:3000)
# on the shared blog_blogcms Docker network.

client_max_body_size 32m;
charset utf-8;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
}

# Runtime admin uploads (Next standalone will not serve files added after build)
location ^~ /uploads/ {
    alias /var/www/portfolio-uploads/;
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

location / {
    # Docker embedded DNS so Nginx still starts if the portfolio container is down
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $portfolio_upstream jb-portfolio:3000;
    proxy_pass http://$portfolio_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
}
