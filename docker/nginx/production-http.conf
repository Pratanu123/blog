# Production HTTP-only bootstrap (validate domain before enabling HTTPS).
# Mounted by docker-compose.prod.yml until certificates exist.
# After SSL: switch to production.conf (see docs/PRODUCTION_DEPLOYMENT.md).

server {
    listen 80;
    listen [::]:80;
    server_name inkandvoltage.com www.inkandvoltage.com;

    include /etc/nginx/snippets/app-locations.conf;
}
