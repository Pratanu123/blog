# Shared production application routing (HTTP + HTTPS server blocks).
# Laravel/PHP-FPM for API and platform routes; React SPA from /var/www/frontend (frontend/dist).

client_max_body_size 32m;
charset utf-8;

add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-XSS-Protection "0" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Laravel public root (API, PHP, SEO endpoints)
root /var/www/html/public;
index index.php;

location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    allow all;
}

location ^~ /api {
    try_files $uri /index.php?$query_string;
}

location ^~ /sanctum {
    try_files $uri /index.php?$query_string;
}

location = /up {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param QUERY_STRING $query_string;
}

location = /sitemap.xml {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param QUERY_STRING $query_string;
}

location = /robots.txt {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param QUERY_STRING $query_string;
}

location = /feed.xml {
    fastcgi_pass php:9000;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
    fastcgi_param SCRIPT_NAME /index.php;
    fastcgi_param QUERY_STRING $query_string;
}

location ^~ /storage/ {
    alias /var/www/html/storage/app/public/;
    expires 30d;
    access_log off;
    add_header Cache-Control "public, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# Built React assets (hashed filenames under /assets/)
location ^~ /assets/ {
    root /var/www/frontend;
    expires 7d;
    access_log off;
    add_header Cache-Control "public";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
}

# React SPA — must be after API/backend locations.
# Do not use "$uri/" with server index index.php: "/" would match the dist
# directory, look for index.php, miss it, and return 403.
location / {
    root /var/www/frontend;
    try_files $uri /index.html;
}

location ~ \.php$ {
    try_files $uri =404;
    fastcgi_split_path_info ^(.+\.php)(/.+)$;
    fastcgi_pass php:9000;
    fastcgi_index index.php;
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param PATH_INFO $fastcgi_path_info;
    fastcgi_param HTTPS $https if_not_empty;
    fastcgi_buffering off;
    fastcgi_read_timeout 120s;
}
